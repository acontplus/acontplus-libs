@if (variant() === 'icon') {
<button
  matIconButton
  [disabled]="isDisabled()"
  [disableRipple]="disableRipple()"
  [acpLoading]="loading()"
  [type]="type()"
  [ngClass]="[colorClass(), squareClass(), blockClass(), sizeClass()]"
  (click)="clicked.emit()"
  (focus)="focused.emit()"
  (blur)="blurred.emit()"
>
  <mat-icon>{{icon()}}</mat-icon>
</button>
} @else if (variant() === 'fab') {
<button
  matFab
  [extended]="extended()"
  [disabled]="isDisabled()"
  [disableRipple]="disableRipple()"
  [acpLoading]="loading()"
  [type]="type()"
  [ngClass]="[colorClass(), sizeClass()]"
  (click)="clicked.emit()"
  (focus)="focused.emit()"
  (blur)="blurred.emit()"
>
  @if (icon()) { <mat-icon>{{icon()}}</mat-icon> } @if (extended()) { @if (hasText()) { {{text()}} }
  @else { <ng-content></ng-content> } }
</button>
} @else if (variant() === 'mini-fab') {
<button
  matMiniFab
  [disabled]="isDisabled()"
  [disableRipple]="disableRipple()"
  [acpLoading]="loading()"
  [type]="type()"
  [ngClass]="[colorClass(), sizeClass()]"
  (click)="clicked.emit()"
  (focus)="focused.emit()"
  (blur)="blurred.emit()"
>
  <mat-icon>{{icon()}}</mat-icon>
</button>
} @else {
<button
  [matButton]="appearance()"
  [disabled]="isDisabled()"
  [disableRipple]="disableRipple()"
  [acpLoading]="loading()"
  [showProgress]="showProgress()"
  [type]="type()"
  [ngClass]="[colorClass(), squareClass(), blockClass(), sizeClass()]"
  (click)="clicked.emit()"
  (focus)="focused.emit()"
  (blur)="blurred.emit()"
>
  @if (icon()) { <mat-icon>{{icon()}}</mat-icon> } @if (hasText()) { {{text()}} } @else {
  <ng-content></ng-content> } @if (showProgress() && progressType() === 'spinner') {
  <mat-progress-spinner
    progressIndicator
    mode="indeterminate"
    [diameter]="20"
    aria-label="Loading"
  />
  } @if (showProgress() && progressType() === 'text') {
  <div progressIndicator role="progressbar" aria-valuemin="0" aria-valuemax="100">
    {{ progressText() }}
  </div>
  } @if (suffixIcon()) {
  <mat-icon iconPositionEnd>{{suffixIcon()}}</mat-icon> }
</button>
}

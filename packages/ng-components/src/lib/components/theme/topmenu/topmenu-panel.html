<mat-menu class="acp-topmenu-panel">
  @for (item of items(); track $index) {
  <ng-template
    [ngxPermissionsOnly]="$safeNavigationMigration(item.permissions?.only)!"
    [ngxPermissionsExcept]="$safeNavigationMigration(item.permissions?.except)!"
  >
    @if (item.type === 'link') {
    <a
      mat-menu-item
      [routerLink]="buildRoute()(parentRoute().concat([item.route]))"
      routerLinkActive="active"
      #rla="routerLinkActive"
      (click)="onRouterLinkClick(rla)"
    >
      {{ item.name }}
    </a>
    } @if (item.type === 'extLink') {
    <a mat-menu-item [href]="item.route">
      <span class="menu-name">{{ item.name }}</span>
      <mat-icon>launch</mat-icon>
    </a>
    } @if (item.type === 'extTabLink') {
    <a mat-menu-item [href]="item.route" target="_blank">
      <span class="menu-name">{{ item.name }}</span>
      <mat-icon>launch</mat-icon>
    </a>
    } @if (item.type === 'sub') {
    <button
      mat-menu-item
      [matMenuTriggerFor]="submenu.menuPanel()"
      [class.active]="item.active?.()"
    >
      {{ item.name }}

      <acp-topmenu-panel
        #submenu
        [items]="item.children || []"
        [parentRoute]="parentRoute().concat([item.route])"
        [level]="level() + 1"
        [buildRoute]="buildRoute()"
        (routeChange)="onRouteChange($event.rla, item)"
      />
    </button>
    }
  </ng-template>
  }
</mat-menu>

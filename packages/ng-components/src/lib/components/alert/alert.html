@if (resolvedIcon(); as iconName) {
<mat-icon class="acp-alert-icon" aria-hidden="true">{{ iconName }}</mat-icon>
}
<div class="acp-alert-body">
  @if (heading()) {
  <div class="acp-alert-title">{{ heading() }}</div>
  }
  <div class="acp-alert-content"><ng-content></ng-content></div>
  <div class="acp-alert-actions"><ng-content select="[acpAlertActions]"></ng-content></div>
</div>
@if (dismissible()) {
<button
  class="acp-alert-close"
  matIconButton
  type="button"
  [attr.aria-label]="closeLabel()"
  (click)="close()"
>
  <svg viewBox="0 0 24 24" width="20px" height="20px" fill="currentColor" focusable="false">
    <path
      d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"
    />
  </svg>
</button>
}

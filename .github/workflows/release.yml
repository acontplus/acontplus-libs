name: Release & Publish to npm

on:
  push:
    branches:
      - main
    paths:
      # A release is deliberate: only a reviewed version plan can trigger it.
      - '.nx/version-plans/**'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Recovery operation to run'
        required: true
        type: choice
        options:
          - publish-angular-22-majors
      confirm:
        description: 'I confirm this publishes the already-tagged Angular 22 major versions.'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Required to push version commits, tags, and create GitHub releases
  contents: write
  # Required for OIDC trusted publishing and npm provenance attestation
  id-token: write

jobs:
  release:
    # The release commit deletes the applied plan; do not run a second release.
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    # Must match the Environment name configured in the npm Trusted Publisher settings
    environment: npm-publish
    steps:
      # RELEASE_TOKEN (PAT) is required to push version commits and tags
      # to main, which is protected and requires PRs for normal pushes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@v6

      # Per https://docs.npmjs.com/trusted-publishers:
      # - registry-url is required for OIDC endpoint configuration
      # - package-manager-cache: false is explicitly recommended for release builds
      # - id-token: write permission enables OIDC token generation
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print Environment Info
        run: pnpm exec nx report

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version, Changelog & Tag
        # Per https://nx.dev/docs/guides/nx-release/publish-in-ci-cd:
        # Run nx release --skip-publish locally (here in CI on main push).
        # This handles: version bump → changelog → git commit → git tag → git push.
        # Tags are created atomically with the version commit in this step.
        id: version
        run: |
          pnpm exec nx release --skip-publish 2>&1 | tee /tmp/nx-release.log
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "package.json\|CHANGELOG"; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HUSKY: '0'

      - name: Push version commits and tags
        if: steps.version.outputs.changes == 'true'
        run: |
          git pull origin main --ff-only
          git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Upgrade npm for OIDC trusted publishing
        # Node 24 bundles npm that may be below 11.5.1 (required for OIDC).
        # Upgrade explicitly and add the new binary to PATH.
        run: |
          npm install -g npm@latest
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: Publish to npm (OIDC trusted publishing)
        if: steps.version.outputs.changes == 'true'
        # pnpm publish has no OIDC support — call npm publish directly.
        #
        # KNOWN UPSTREAM BUG: npm/cli#8730 (open since Nov 2025) — OIDC trusted
        # publishing fails with E404/ENEEDAUTH specifically for SCOPED packages
        # (@org/name) even with correct configuration. Workarounds from that
        # thread that resolved it for other scoped-package maintainers:
        #   - explicit --provenance flag on npm publish
        #   - NPM_CONFIG_PROVENANCE=true env var
        #   - repository.url in package.json WITHOUT the "git+" prefix
        # All three are applied here. If OIDC still fails, NPM_TOKEN is used
        # as a fallback so releases are not permanently blocked by the bug.
        run: |
          echo "registry=https://registry.npmjs.org/" > "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npm --version

          published=0
          skipped=0
          failed=0

          for dir in dist/packages/*/; do
            if [ -f "$dir/package.json" ]; then
              pkg_name=$(node -p "require('./$dir/package.json').name")
              pkg_version=$(node -p "require('./$dir/package.json').version")
              echo "::group::Publishing $pkg_name@$pkg_version"

              # npm cannot publish workspace: references. Materialize them in the
              # dist manifest using the versions selected by Nx Release.
              node tools/prepare-dist-package-manifest.mjs "$dir"

              if npm publish "$dir" --access public --provenance; then
                echo "✓ Published $pkg_name@$pkg_version"
                published=$((published + 1))
              else
                if npm view "$pkg_name@$pkg_version" version 2>/dev/null | grep -q "$pkg_version"; then
                  echo "⊘ Skipped $pkg_name@$pkg_version (already published)"
                  skipped=$((skipped + 1))
                elif [ -n "$NPM_TOKEN" ]; then
                  echo "OIDC failed, retrying with NPM_TOKEN fallback (npm/cli#8730)..."
                  if NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish "$dir" --access public; then
                    echo "✓ Published $pkg_name@$pkg_version (via token fallback)"
                    published=$((published + 1))
                  else
                    echo "✗ Failed to publish $pkg_name@$pkg_version"
                    failed=$((failed + 1))
                  fi
                else
                  echo "✗ Failed to publish $pkg_name@$pkg_version"
                  failed=$((failed + 1))
                fi
              fi
              echo "::endgroup::"
            fi
          done

          echo ""
          echo "Summary: $published published, $skipped skipped, $failed failed"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-angular-22-majors-recovery:
    # This is deliberately narrow: it recovers the one interrupted Angular 22
    # publish without re-running Nx versioning, changelog generation, or tagging.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish-angular-22-majors' &&
      inputs.confirm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the already-versioned Angular packages
        run: >-
          pnpm exec nx run-many -t build
          --projects=ng-auth,ng-common,ng-components,ng-config,ng-customer,ng-infrastructure,ng-notifications
          --parallel=3

      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@latest
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: Publish Angular 22 major recovery (OIDC trusted publishing)
        # npm publish, rather than pnpm publish, is required for npm OIDC.
        # Check first so a retry is idempotent if a previous run published only
        # a subset of packages before it was cancelled.
        run: |
          echo "registry=https://registry.npmjs.org/" > "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npm --version

          published=0
          skipped=0
          failed=0

          for project in ng-auth ng-common ng-components ng-config ng-customer ng-infrastructure ng-notifications; do
            dir="dist/packages/$project"
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pkg_version=$(node -p "require('./$dir/package.json').version")
            echo "::group::Publishing $pkg_name@$pkg_version"

            if npm view "$pkg_name@$pkg_version" version 2>/dev/null | grep -Fxq "$pkg_version"; then
              echo "⊘ Skipped $pkg_name@$pkg_version (already published)"
              skipped=$((skipped + 1))
              echo "::endgroup::"
              continue
            fi

            node tools/prepare-dist-package-manifest.mjs "$dir"

            if npm publish "$dir" --access public --provenance; then
              echo "✓ Published $pkg_name@$pkg_version"
              published=$((published + 1))
            elif [ -n "$NPM_TOKEN" ] && NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish "$dir" --access public; then
              echo "✓ Published $pkg_name@$pkg_version (via token fallback)"
              published=$((published + 1))
            else
              echo "✗ Failed to publish $pkg_name@$pkg_version"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          echo "Summary: $published published, $skipped skipped, $failed failed"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

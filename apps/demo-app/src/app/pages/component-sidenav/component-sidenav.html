<mat-sidenav-container class="docs-component-viewer-sidenav-container">
  @if (isScreenSmall | async) {
  <mat-sidenav
    #sidenav
    class="docs-component-viewer-sidenav"
    role="navigation"
    [opened]="(isScreenSmall | async) === false"
    [mode]="(isScreenSmall | async) ? 'over' : 'side'"
    [fixedInViewport]="isScreenSmall | async"
    [fixedTopGap]="(isExtraScreenSmall | async) ? 92 : 56"
  >
    <app-component-nav />
  </mat-sidenav>
  }

  <mat-sidenav-content class="docs-component-sidenav-content" cdkScrollable>
    <app-component-page-header (toggleSidenav)="toggleSidenav(sidenav)" />
    <div class="docs-component-sidenav-inner-content">
      <main class="docs-component-sidenav-body-content acontplus-page-content">
        @if ((isScreenSmall | async) === false) {
        <app-component-nav />
        }
        <router-outlet></router-outlet>
      </main>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

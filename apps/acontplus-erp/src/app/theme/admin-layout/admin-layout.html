<ng-progress ngProgressRouter />

<acp-layout [menu]="menu()">
  <acp-apps-button acpHeaderStart [apps]="apps" />
  <acp-notifications-button
    acpHeaderEnd
    [items]="notifications"
    footerLabel="Ver todas"
    footerRoute="/"
  />
  <acp-user-menu
    acpHeaderEnd
    [user]="userProfile()"
    [items]="userMenuItems"
    (selected)="onUserMenu($event)"
  />

  <acp-user-panel
    acpSidebarUser
    link="/profile/overview"
    [avatar]="userProfile().avatar"
    [title]="userProfile().name"
    [subtitle]="userProfile().subtitle"
  />

  <router-outlet />
</acp-layout>

<acp-customizer />

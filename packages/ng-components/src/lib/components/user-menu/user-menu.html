<button
  mat-icon-button
  class="acp-user-menu__trigger"
  [matMenuTriggerFor]="menu"
  aria-label="User menu"
>
  @if (user().avatar) {
    <img [src]="user().avatar" [alt]="" class="acp-user-menu__avatar" />
  } @else {
    <mat-icon>account_circle</mat-icon>
  }
</button>

<mat-menu #menu="matMenu" class="acp-user-menu-panel"  panelClass="user-menu-panel">
  <div class="acp-user-menu__content">
    <acp-user-menu-header [user]="user()" />

    <div class="acp-user-menu__items">
      @for (item of items(); track item.id) {
        <acp-user-menu-item [item]="item"   />
      }
    </div>
  </div>
</mat-menu>
